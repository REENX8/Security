[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phish-features"
version = "1.5.0"
description = "Shared feature-extraction contract for the Thai Phishing URL Detection system"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "REENX8", email = "asdawesdzd22@gmail.com" },
]
dependencies = [
    "Levenshtein>=0.25",
    "python-whois>=0.9.4",
]

[project.optional-dependencies]
ml = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "joblib>=1.3",
    "requests>=2.31",
]

[tool.setuptools]
packages = ["phish_features"]

# ---------------------------------------------------------------------------
# Tooling (C2: lint / format / type gate, C1: coverage gate)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["graphify-out", "dashboard", "models", "data", "backend/migrations"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sort, UP pyupgrade, B bugbear, C4 comprehensions.
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # line length is enforced loosely; long URLs/Thai strings abound
    "B008",  # FastAPI/slowapi inject via `= Depends(...)` in arg defaults
    "B904",  # `raise ... from` not required for our AppError re-raises
    "UP038", # isinstance tuple form is clearer here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]          # tests configure env before importing app
"tests/conftest.py" = ["E402"]
"backend/app/main.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Pragmatic gate: catch obvious type errors without forcing full annotations
# on an existing codebase. Tighten module-by-module over time.
check_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = false
exclude = "(graphify-out|dashboard|models|data|backend/migrations|tests)"

[tool.coverage.run]
source = ["backend/app", "phish_features"]
branch = true
omit = ["*/__init__.py", "backend/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
