name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [ROADMAP](../../ROADMAP.md) first — your idea may already be planned.

  - type: textarea
    id: problem
    attributes:
      label: Problem this feature solves
      description: What user need or pain point does this address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you considered and why you prefer this one.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - ML / detection accuracy
        - Backend API
        - Dashboard
        - Browser extension
        - Integrations (LINE, SMS, TAXII)
        - Observability / ops
        - Documentation
        - Other
    validations:
      required: true
