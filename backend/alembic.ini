# Alembic configuration for the phishing-detector backend.
# The database URL is NOT set here — env.py reads it from DATABASE_URL (or the
# app settings) so the same async driver (asyncpg / aiosqlite) is reused.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Timezone-aware UTC timestamps in generated revision filenames.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
